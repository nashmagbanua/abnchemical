<script>

/* ============================================================

const SUPABASE_URL =

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiZWFjcnBveWZhY2dtYnp4amN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg2NTM5NTIsImV4cCI6MjA2NDIyOTk1Mn0.6kfxKLJxidw4BcqsMJte61AtzydrTW-1ZJIJytiUBt4";


/* ============================================================

let chemicals = [
    {
        id: "hydro",

        image: "hydrologic-acid.png"

    {

    },
    {
        id: "alum",

        alert: 50,
        image: "aluminium.png"
    },

        id: "polymer",
        name: "Polymer",
        unit: "kg",

    },
    {

        name: "Ammonium Phosphate",
        unit: "kg",
        balance: 0,
        alert: 50,
        image: "ammonium.png"
    }
];


/* ============================================================
   STATE
   ============================================================ */

let activeTab = "OUT";
let currentArea = null;
let selectedQtys = {};
let activeTxChemId = null;
let logs = [];
let inventoryLoading = false;


/* ============================================================
   SUPABASE REQUEST HELPER
   ============================================================ */

async function supabaseRequest(endpoint, options = {}) {

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/${endpoint}`,
        {
            method: options.method || "GET",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                "Content-Type": "application/json",
                "Prefer": options.prefer || "return=representation",
                ...(options.headers || {})
            },

            body: options.body
                ? JSON.stringify(options.body)
                : undefined
        }
    );

    const text = await response.text();

    let data = null;

    try {
        data = text ? JSON.parse(text) : null;
    } catch {
        data = text;
    }

    if (!response.ok) {

        console.error(
            "SUPABASE ERROR:",
            response.status,
            data
        );

        throw new Error(
            data?.message ||
            data?.hint ||
            data?.details ||
            `Supabase request failed (${response.status})`
        );
    }

    return data;
}


/* ============================================================
   DATE HELPERS
   ============================================================ */

function getToday() {

    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function formatTime(value) {

    if (!value) return "";

    try {

        return new Date(value).toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    } catch {

        return value;
    }
}


function formatDate(value) {

    if (!value) return "";

    try {

        return new Date(value).toLocaleDateString(
            "en-US",
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        );

    } catch {

        return value;
    }
}


/* ============================================================
   CHEMICAL FINDER
   ============================================================ */

function findChemicalByName(name) {

    if (!name) return null;

    const normalized = String(name)
        .trim()
        .toLowerCase();

    return chemicals.find(c =>
        c.name.toLowerCase() === normalized
    ) || null;
}


function getChemicalIdFromName(name) {

    const chem = findChemicalByName(name);

    return chem ? chem.id : null;
}


/* ============================================================
   LOAD INVENTORY FROM SUPABASE
   ============================================================ */

async function loadInventory() {

    inventoryLoading = true;

    try {

        const data = await supabaseRequest(
            "chemical_inventory?select=id,chemical,unit,quantity,updated_at&order=chemical.asc"
        );

        chemicals.forEach(chem => {

            const row = data.find(
                item =>
                    String(item.chemical).trim().toLowerCase()
                    === chem.name.trim().toLowerCase()
            );

            if (row) {

                chem.balance = Number(row.quantity || 0);

                if (row.unit) {
                    chem.unit = row.unit;
                }

                chem.inventoryId = row.id;
            }
        });

        updateNotifBadge();

    } catch (error) {

        console.error(error);

        alert(
            "Unable to load chemical inventory from Supabase.\n\n" +
            error.message
        );

    } finally {

        inventoryLoading = false;
    }
}


/* ============================================================
   LOAD LOGS FROM SUPABASE
   ============================================================ */

async function loadLogs() {

    try {

        const data = await supabaseRequest(
            "chemical_logs?select=id,timestamp,chemical,action,quantity,unit,area,shift,new_main_balance,new_area_balance,operator_name&order=timestamp.desc&limit=5000"
        );

        logs = data.map(row => {

            const chem = findChemicalByName(row.chemical);

            return {
                id: row.id,
                date: row.timestamp
                    ? row.timestamp.substring(0, 10)
                    : "",
                time: formatTime(row.timestamp),
                timestamp: row.timestamp,
                chemId: chem?.id || "",
                chemName: row.chemical,
                area: row.area || "",
                qty: Number(row.quantity || 0),
                unit: row.unit || chem?.unit || "",
                operator: row.operator_name || "",
                receivedBy: row.operator_name || "",
                type: String(row.action || "").toUpperCase(),
                newMainBalance: row.new_main_balance,
                newAreaBalance: row.new_area_balance
            };
        });

        updateNotifBadge();

    } catch (error) {

        console.error(error);

        alert(
            "Unable to load chemical logs from Supabase.\n\n" +
            error.message
        );
    }
}


/* ============================================================
   INITIALIZATION
   ============================================================ */

async function init() {

    document.getElementById("display-date").innerText =

            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        );

    document.getElementById("currentYear").textContent =
        new Date().getFullYear();

    document.getElementById("admin-chem-select").innerHTML =
        chemicals.map(c =>
            `<option value="${c.id}">
                ${c.name}
            </option>`
        ).join("");

    await loadInventory();
    await loadLogs();

    updateNotifBadge();
}


/* ============================================================
   CHEMICAL CARDS
   ============================================================ */

function renderChems() {

    document.getElementById("chem-grid").innerHTML =
        chemicals.map(c => {

            if (selectedQtys[c.id] === undefined) {
                selectedQtys[c.id] = 0;
            }

            const currentQty = selectedQtys[c.id];

            const isLowStock =
                c.balance <= c.alert;

            const badgeColor =
                isLowStock
                    ? "bg-red-500 text-white"
                    : "bg-emerald-600 text-white";

            const cardAlertStyle =
                isLowStock
                    ? "border-red-200/60 shadow-red-500/5"
                    : "border-white/60 shadow-emerald-900/5";

            const badgeVisibility =
                currentQty > 0
                    ? "scale-100 opacity-100"
                    : "scale-75 opacity-0 pointer-events-none";

            return `
                <div
                    class="glass-card relative rounded-[2.5rem] p-4 flex flex-col shadow-xl ${cardAlertStyle} overflow-hidden">

                    <div class="flex justify-between items-center w-full mb-2 px-1">

                        <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest">
                            Stock
                        </span>

                        <span class="text-[10px] font-black ${
                            isLowStock
                                ? "text-red-600 animate-pulse"
                                : "text-emerald-700"
                        }">

                            ${c.balance}

                            <span class="text-[7px] font-bold text-slate-400 uppercase">
                                ${c.unit}
                            </span>

                        </span>

                    </div>


                    <div
                        class="relative w-full h-24 flex items-center justify-center mb-2 bg-white/40 rounded-2xl p-2 border border-white/20">

                        <div
                            id="badge-${c.id}"
                            class="absolute -top-1.5 -right-1.5 ${badgeColor} text-[11px] font-black px-2.5 py-1 rounded-full shadow-md z-30 transition-all duration-300 transform ${badgeVisibility}">

                            +${currentQty}

                        </div>

                        <img
                            src="assets/${c.image}"
                            alt="${c.name}"
                            class="max-w-full max-h-full object-contain drop-shadow-md">

                    </div>


                    <div class="w-full text-center px-1 mb-3">

                        <h3
                            class="text-[10px] font-black uppercase text-emerald-950 leading-tight tracking-tighter line-clamp-1">

/* ============================================================
   QUANTITY CONTROL
   ============================================================ */

function adjustQty(chemId, change) {

    const chem =
        chemicals.find(c => c.id === chemId);

    if (!chem) return;

    const targetElement =
        document.getElementById(`display-qty-${chemId}`);

    const badgeElement =
        document.getElementById(`badge-${chemId}`);

    let newQty =
        (selectedQtys[chemId] || 0) + change;

    if (newQty < 0) {
        return;
    }

    if (newQty > chem.balance) {

        alert(
            `Cannot exceed available stock balance (${chem.balance} ${chem.unit})`
        );

        return;
    }

    selectedQtys[chemId] = newQty;

    if (targetElement) {

        targetElement.innerText = newQty;

        targetElement.classList.remove("qty-bounce");

        void targetElement.offsetWidth;

        targetElement.classList.add("qty-bounce");
    }

    if (badgeElement) {

        badgeElement.innerText =
            `+${newQty}`;

        if (newQty > 0) {

            badgeElement.classList.remove(
                "scale-75",
                "opacity-0",
                "pointer-events-none"
            );

            badgeElement.classList.add(
                "scale-100",
                "opacity-100"
            );

        } else {

            badgeElement.classList.remove(
                "scale-100",
                "opacity-100"
            );

            badgeElement.classList.add(
                "scale-75",
                "opacity-0",
                "pointer-events-none"
            );
        }
    }
}

function getCurrentShift() {

    return (
        hour >= 6 &&
        hour < 18
    )
        ? "DS"
        : "NS";
}


/* ============================================================
   CHEMICAL USAGE / OUT
   ============================================================ */

async function executeSupabaseTx() {

    const operatorName =
        document
            .getElementById("tx-operator")
            .value
            .trim()
            .toUpperCase();

    if (!operatorName) {

        alert(
            "Operator name is required."
        );

        return;
    }

    const chemId =
        activeTxChemId;

    if (!chemId) return;

    const deductionQty =
        Number(selectedQtys[chemId] || 0);

    const chem =
        chemicals.find(c => c.id === chemId);

    if (!chem || deductionQty <= 0) {
        return;
    }

    if (chem.balance < deductionQty) {

        alert(
            "Insufficient chemical inventory."
        );

        closeTxModal();

        return;
    }

    const newBalance =
        Number(chem.balance) -
        deductionQty;

    const now =
        new Date().toISOString();

    try {

        /*
         * STEP 1
         * UPDATE MAIN INVENTORY
         */

        if (!chem.inventoryId) {

            const inventoryRows =
                await supabaseRequest(
                    `chemical_inventory?chemical=eq.${encodeURIComponent(chem.name)}&select=id,quantity`
                );

            if (!inventoryRows.length) {

                throw new Error(
                    `Inventory record not found for ${chem.name}.`
                );
            }

            chem.inventoryId =
                inventoryRows[0].id;
        }


        await supabaseRequest(
            `chemical_inventory?id=eq.${chem.inventoryId}`,
            {
                method: "PATCH",

                body: {
                    quantity: newBalance,
                    updated_at: now
                }
            }
        );


        /*
         * STEP 2
         * CREATE USAGE LOG
         */

        await supabaseRequest(
            "chemical_logs",
            {
                method: "POST",

                body: {
                    timestamp: now,
                    chemical: chem.name,
                    action: "OUT",
                    quantity: deductionQty,
                    unit: chem.unit,
                    area: currentArea,
                    shift: getCurrentShift(),
                    new_main_balance: newBalance,
                    new_area_balance: null,
                    operator_name: operatorName
                }
            }
        );


        /*
         * STEP 3
         * UPDATE LOCAL MEMORY ONLY FOR UI
         */

        chem.balance =
            newBalance;

        selectedQtys[chemId] =
            0;

        await loadLogs();

        renderChems();

        updateNotifBadge();

        closeTxModal();

        alert(
            "Chemical usage successfully recorded."
        );

    } catch (error) {

        console.error(
            "TRANSACTION ERROR:",
            error
        );

        alert(
            "Transaction failed.\n\n" +
            error.message
        );
    }
}


/* ============================================================
   DELIVERY / STOCK IN
   ============================================================ */

async function adminAddStock() {

    const id =
        document
            .getElementById("admin-chem-select")
            .value;

    const qtyInput =
        parseFloat(
            document
                .getElementById("admin-qty")
                .value
        );

    const receiver =
        document
            .getElementById("admin-receiver")
            .value
            .trim()
            .toUpperCase();

    if (!qtyInput || qtyInput <= 0) {

        alert(
            "Enter a valid quantity."
        );

        return;
    }

    if (!receiver) {

        alert(
            "Received By is required."
        );

        return;
    }

    const chem =
        chemicals.find(c => c.id === id);

    if (!chem) return;


    /*
     * ALUMINIUM:
     * Existing system treats one sack as 25 kg.
     */

    const finalAdd =
        id === "alum"
            ? qtyInput * 25
            : qtyInput;


    const newBalance =
        Number(chem.balance) +
        finalAdd;

    const now =
        new Date().toISOString();


    try {

        /*
         * GET INVENTORY ID IF NEEDED
         */

        if (!chem.inventoryId) {

            const rows =
                await supabaseRequest(
                    `chemical_inventory?chemical=eq.${encodeURIComponent(chem.name)}&select=id,quantity`
                );

            if (!rows.length) {

                throw new Error(
                    `Inventory record not found for ${chem.name}.`
                );
            }

            chem.inventoryId =
                rows[0].id;
        }


        /*
         * UPDATE INVENTORY
         */

        await supabaseRequest(
            `chemical_inventory?id=eq.${chem.inventoryId}`,
            {
                method: "PATCH",

                body: {
                    quantity: newBalance,
                    updated_at: now
                }
            }
        );


        /*
         * CREATE DELIVERY LOG
         */

        await supabaseRequest(
            "chemical_logs",
            {
                method: "POST",

                body: {
                    timestamp: now,
                    chemical: chem.name,
                    action: "IN",
                    quantity: qtyInput,
                    unit:
                        id === "alum"
                            ? "Sacks"
                            : chem.unit,
                    area: "WAREHOUSE",
                    shift: getCurrentShift(),
                    new_main_balance: newBalance,
                    new_area_balance: null,
                    operator_name: receiver
                }
            }
        );


        /*
         * UPDATE UI
         */

        chem.balance =
            newBalance;

        await loadLogs();

        renderChems();

        updateNotifBadge();

        document.getElementById("admin-qty").value = "";

        document.getElementById("admin-receiver").value = "";

        document
            .getElementById("delivery-form")
            .classList.add("hidden");

        if (activeTab === "IN") {
            applyFilters();
        }

        alert(
            `Successfully added ${qtyInput} ${
                id === "alum"
                    ? "sacks"
                    : chem.unit
            }`
        );

    } catch (error) {

        console.error(error);

        alert(
            "Delivery failed.\n\n" +
            error.message
        );
    }
}

/* ============================================================
   DELETE USAGE / RESTORE STOCK
   ============================================================ */

async function deleteUsage(logId) {

    if (!confirm(
        "CORRECTION:\n\n" +
        "Delete this usage and RETURN stock to inventory?"
    )) {
        return;
    }


    const logEntry =
        logs.find(
            l =>
                String(l.id) ===
                String(logId)
        );

    if (!logEntry) return;


    const chem =
        chemicals.find(
            c =>
                c.id === logEntry.chemId
        );

    if (!chem) {

        alert(
            "Chemical not found."
        );

        return;
    }


    try {

        const newBalance =
            Number(chem.balance) +
            Number(logEntry.qty);


        /*
         * RESTORE INVENTORY
         */

        await supabaseRequest(
            `chemical_inventory?id=eq.${chem.inventoryId}`,
            {
                method: "PATCH",

                body: {
                    quantity: newBalance,
                    updated_at:
                        new Date().toISOString()
                }
            }
        );


        /*
         * DELETE LOG
         */

        await supabaseRequest(
            `chemical_logs?id=eq.${logId}`,
            {
                method: "DELETE"
            }
        );


        chem.balance =
            newBalance;


        await loadLogs();

        applyFilters();

        renderChems();

        updateNotifBadge();


        alert(
            "Usage undone. Stock restored!"
        );

    } catch (error) {

        console.error(error);

        alert(
            "Unable to undo usage.\n\n" +
            error.message
        );
    }
}


/* ============================================================
   DELETE DELIVERY
   ============================================================ */

async function deleteDelivery(logId) {

    if (!confirm(
        "CORRECTION:\n\n" +
        "Remove this delivery and deduct the stock?"
    )) {
        return;
    }


    const logEntry =
        logs.find(
            l =>
                String(l.id) ===
                String(logId)
        );

    if (!logEntry) return;


    const chem =
        chemicals.find(
            c =>
                c.id === logEntry.chemId
        );

    if (!chem) {

        alert(
            "Chemical not found."
        );

        return;
    }


    /*
     * For Aluminium:
     * quantity is stored as sacks.
     * One sack = 25 kg.
     */

    const amountToDeduct =
        chem.id === "alum"
            ? Number(logEntry.qty) * 25
            : Number(logEntry.qty);


    if (
        Number(chem.balance) <
        amountToDeduct
    ) {

        if (!confirm(
            "Warning:\n\n" +
            "Current stock is lower than the delivery amount.\n" +
            "Proceed and allow the balance to go negative?"
        )) {
            return;
        }
    }


    try {

        const newBalance =
            Number(chem.balance) -
            amountToDeduct;


        /*
         * UPDATE INVENTORY
         */

        await supabaseRequest(
            `chemical_inventory?id=eq.${chem.inventoryId}`,
            {
                method: "PATCH",

                body: {
                    quantity: newBalance,
                    updated_at:
                        new Date().toISOString()
                }
            }
        );


        /*
         * DELETE DELIVERY LOG
         */

        await supabaseRequest(
            `chemical_logs?id=eq.${logId}`,
            {
                method: "DELETE"
            }
        );


        chem.balance =
            newBalance;


        await loadLogs();

        applyFilters();

        renderChems();

        updateNotifBadge();


        alert(
            "Delivery record removed. Stock adjusted!"
        );

    } catch (error) {

        console.error(error);

        alert(
            "Unable to delete delivery.\n\n" +
            error.message
        );
    }
}

            );
    }


    const areas = [
        "BOILER",
        "WTP",
        "WWTP",
        "OTHERS"
    ];


    chart.innerHTML =
        fl.length

            ? areas.map(area => {

                const areaLogs =
                    fl.filter(
                        l =>
                            l.area === area
                    );


                const total =
                    areaLogs.reduce(
                        (acc, curr) =>
                            acc + Number(curr.qty),
                        0
                    );


                const chemMap = {};


                areaLogs.forEach(l => {

                    chemMap[l.chemName] =
                        (
                            chemMap[l.chemName] ||
                            0
                        ) +
                        Number(l.qty);

                });


                const maxVal =
                    period === "year"
                        ? 1000
                        : period === "month"
                            ? 200
                            : 30;


                const perc =
                    Math.min(
                        (total / maxVal) * 100,
                        100
                    );


                return `

                    <div>

                        <div class="flex justify-between text-[10px] font-black mb-1 uppercase">

                            <span>
                                ${area}
                            </span>

                            <span class="text-emerald-600">
                                ${total} Units
                            </span>

                        </div>


                        <div class="bg-emerald-50 h-3 rounded-full overflow-hidden border border-emerald-100">

                            <div
                                class="bg-emerald-600 h-full rounded-full transition-all duration-1000"
                                style="width: ${perc}%">
                            </div>

                        </div>


                        <div class="flex flex-wrap gap-x-3 gap-y-1 mt-2">

                            ${
                                Object.entries(
                                    chemMap
                                )
                                .map(
                                    ([name, qty]) =>
                                        `<span class="text-[8px] font-black text-emerald-400 uppercase italic">
                                            • ${name} (${qty})
                                        </span>`
                                )
                                .join("")
                            }

                        </div>

                    </div>
                `;

            }).join("")

            : `

                <div class="py-12 text-center text-emerald-100 text-[10px] font-black uppercase italic">

                    No Data

                </div>
            `;
}

/* ============================================================
   SHIFT SUMMARY
   ============================================================ */

function showShiftSummary() {

    const shift =
        getCurrentShift();

    const today =
        getToday();


    const todayLogs =
        logs.filter(
            l =>
                l.date === today
        );


    const usage =
        todayLogs.filter(
            l =>
                l.type === "OUT"
        );


    const delivery =
        todayLogs.filter(
            l =>
                l.type === "IN"
        );


    let res =
        `📌 SHIFT REPORT (${shift})\n` +
        `Date: ${today}\n\n`;


    res +=
        `--- USAGE ---\n`;


    if (usage.length) {

        chemicals.forEach(c => {

            const used =
                usage
                    .filter(
                        l =>
                            l.chemId === c.id
                    )
                    .reduce(
                        (acc, curr) =>
                            acc + Number(curr.qty),
                        0
                    );


            if (used > 0) {

                res +=
                    `🔹 ${c.name}: ${used} ${c.unit}\n`;
            }
        });

    } else {

        res +=
            "(No usage)\n";
    }


    res +=
        `\n--- DELIVERIES ---\n`;


    if (delivery.length) {

        delivery.forEach(d => {

            res +=
                `📦 ${d.chemName}: +${d.qty} ${d.unit} (${d.operator})\n`;
        });

    } else {

        res +=
            "(No deliveries)\n";
    }


    document.getElementById(
        "summary-text"
    ).innerText = res;


    document.getElementById(
        "summary-modal"
    ).style.display = "flex";


    document.getElementById(
        "summary-badge"
    ).classList.add("hidden");
}

/* ============================================================
   EXCEL / CSV EXPORT
   ============================================================ */

function exportCSV() {

    let data =
        [...logs];


    const dateElement =
        document.getElementById("f-date");

    const dateValue =
        dateElement
            ? dateElement.value
            : "";


    if (activeTab === "OUT") {

        data =
            data.filter(
                l =>
                    l.type === "OUT"
            );

        const chemElement =
            document.getElementById("f-chem");

        const areaElement =
            document.getElementById("f-area");


        const chemFilter =
            chemElement
                ? chemElement.value
                : "ALL";


        const areaFilter =
            areaElement
                ? areaElement.value
                : "ALL";


        if (chemFilter !== "ALL") {

            data =
                data.filter(
                    l =>
                        l.chemId === chemFilter
                );
        }


        if (areaFilter !== "ALL") {

            data =
                data.filter(
                    l =>
                        l.area === areaFilter
                );
        }

    } else {

        data =
            data.filter(
                l =>
                    l.type === "IN"
            );


        const receiverElement =
            document.getElementById("f-rcv");


        const search =
            receiverElement
                ? receiverElement.value
                    .trim()
                    .toUpperCase()
                : "";


        if (search) {

            data =
                data.filter(
                    l =>
                        (l.operator || "")
                            .toUpperCase()
                            .includes(search)
                );
        }
    }


    if (dateValue) {

        data =
            data.filter(
                l =>
                    l.date === dateValue
            );

    } else {

        const month =
            getToday().slice(0, 7);

        data =
            data.filter(
                l =>
                    l.date.startsWith(month)
            );
    }


    const header = [
        "Date",
        "Time",
        "Chemical",
        "Action",
        "Area",
        "Shift",
        "Operator Name",
        "Quantity",
        "Unit",
        "New Main Balance",
        "New Area Balance"
    ];


    const csvRows = [
        header
    ];


    data.forEach(l => {

        csvRows.push([
            l.date,
            l.time,
            l.chemName,
            l.type,
            l.area,
            l.shift || "",
            l.operator || "",
            l.qty,
            l.unit,
            l.newMainBalance ?? "",
            l.newAreaBalance ?? ""
        ]);
    });


    const csv =
        csvRows
            .map(
                row =>
                    row
                        .map(
                            value =>
                                `"${String(value ?? "")
                                    .replace(/"/g, '""')}"`
                        )
                        .join(",")
            )
            .join("\n");


    const blob =
        new Blob(
            [
                "\uFEFF" +
                csv
            ],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    const date =
        getToday();


    link.href =
        url;


    link.download =
        `ABN-Chemical-Logbook-${activeTab}-${date}.csv`;


    document.body.appendChild(link);

    link.click();

    link.remove();


    URL.revokeObjectURL(url);
}


/* ============================================================
   HTML ESCAPE
   ============================================================ */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function updateNotifBadge() {

    const low =

                Number(c.alert)

    const notifBadge =
        document.getElementById(
            "notif-badge"

    notifBadge.innerText =

    notifBadge.classList.toggle(

        low === 0

    const todayCount =
        logs.filter(
            l =>

        ).length;


    document
        .getElementById(
            "summary-badge"
        )
        .classList.toggle(
            "hidden",
            todayCount === 0
        );
}
