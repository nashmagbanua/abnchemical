/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL = "https://qbeacrpoyfacgmbzxjcu.supabase.co";

const SUPABASE_KEY = "sb_publishable_IU3Vhz1Sojgj_mfmV3U5wQ_0u1yYYhT";


/* =========================================================
   SUPABASE REST HELPER
   ========================================================= */

async function supabaseRequest(table, options = {}) {

    const {
        method = "GET",
        query = "",
        body = null,
        prefer = ""
    } = options;

    const url =
        `${SUPABASE_URL}/rest/v1/${table}${query}`;

    const headers = {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
    };

    if (prefer) {
        headers["Prefer"] = prefer;
    }

    const response = await fetch(url, {
        method,
        headers,
        body: body !== null
            ? JSON.stringify(body)
            : undefined
    });

    const text = await response.text();

    let data = null;

    if (text) {
        try {
            data = JSON.parse(text);
        } catch {
            data = text;
        }
    }

    if (!response.ok) {

        console.error(
            "[Supabase]",
            response.status,
            data
        );

        const message =
            data?.message ||
            data?.error_description ||
            data?.hint ||
            data?.details ||
            `Supabase request failed (${response.status})`;

        throw new Error(message);
    }

    return data;
}
/* =========================================================
   APPLICATION STATE
   ========================================================= */

let inventoryRows = [];
let logs = [];

let activeTab = "OUT";
let currentArea = null;
let selectedQtys = {};
let activeTxChemId = null;

let isLoadingInventory = false;
let isLoadingLogs = false;


/* =========================================================
   CHEMICAL DEFINITIONS
   ========================================================= */

const chemicalDefinitions = [

    {
        id: "hydro",
        name: "Hydrochloric Acid",
        unit: "Cby",
        alert: 10,
        image: "hydrologic-acid.png"
    },

    {
        id: "caustic",
        name: "Caustic Soda",
        unit: "Cby",
        alert: 10,
        image: "caustic.png"
    },

    {
        id: "chlorine",
        name: "Chlorine",
        unit: "Cby",
        alert: 10,
        image: "chlorine.png"
    },

    {
        id: "alum",
        name: "Aluminium Sulphate",
        unit: "kg",
        alert: 50,
        image: "aluminium.png"
    },

    {
        id: "polymer",
        name: "Polymer",
        unit: "kg",
        alert: 25,

    },

        alert: 50,

];


/* =========================================================
   CHEMICAL OBJECTS USED BY UI
   ========================================================= */

let chemicals = chemicalDefinitions.map(def => ({
    ...def,
    balance: 0,
    dbId: null
}));


/* =========================================================
   UTILITY FUNCTIONS
   ========================================================= */

function getToday() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1).padStart(2, "0");

    const day =
        String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function getCurrentShift() {

    const hour =
        new Date().getHours();

    return (
        hour >= 6 &&
        hour < 18
    )
        ? "DS"
        : "NS";
}


function normalizeChemicalName(name) {

    return String(name || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

}


function findChemicalByName(name) {

    const normalized =
        normalizeChemicalName(name);

    return chemicals.find(c =>
        normalizeChemicalName(c.name) === normalized
    );

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function formatNumber(value) {

    const n =
        Number(value || 0);

    return Number.isInteger(n)
        ? String(n)
        : n.toFixed(2).replace(/\.?0+$/, "");

}


function formatDateTime(value) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (Number.isNaN(date.getTime())) {
        return String(value);
    }

    return date.toLocaleString(
        "en-PH",
        {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(
    message,
    type = "success"
) {

    const container =
        document.getElementById("toast-container");

    const toast =
        document.createElement("div");

    let style =
        "bg-emerald-700 text-white";

    let icon =
        "✓";

    if (type === "error") {

        style =
            "bg-red-600 text-white";

        icon =
            "!";
    }

    if (type === "warning") {

        style =
            "bg-amber-500 text-white";

        icon =
            "!";
    }

    toast.className =
        `toast pointer-events-auto ${style}
         px-5 py-3 rounded-2xl shadow-xl
         text-[10px] font-black uppercase
         tracking-wide flex items-center gap-2`;

    toast.innerHTML =
        `<span class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center">${icon}</span>
         <span>${escapeHtml(message)}</span>`;

    container.appendChild(toast);

    setTimeout(() => {
        toast.remove();
    }, 3700);

}

/* =========================================================
   LOAD INVENTORY
   ========================================================= */

async function loadInventory() {

    if (isLoadingInventory) {
        return;
    }

    isLoadingInventory = true;

    try {

        const rows =
            await supabaseRequest(
                "chemical_inventory",
                {
                    method: "GET",
                    query: "?select=id,chemical,unit,quantity,updated_at&order=chemical.asc"
                }
            );

        inventoryRows =
            Array.isArray(rows)
                ? rows
                : [];

        chemicals.forEach(chem => {

            const row =
                inventoryRows.find(item =>
                    normalizeChemicalName(item.chemical) ===
                    normalizeChemicalName(chem.name)
                );

            if (row) {

                chem.dbId =
                    row.id;

                chem.balance =
                    Number(row.quantity || 0);

                if (row.unit) {
                    chem.unit =
                        row.unit;
                }

            } else {

                chem.dbId =
                    null;

                chem.balance =
                    0;
            }

        });

        populateChemicalSelect();

        setConnectionStatus(
            true,
            "Supabase Connected"
        );

        updateNotifBadge();

        if (!document
            .getElementById("chem-screen")
            .classList.contains("hidden")) {

            renderChems();
        }

    } catch (error) {

        console.error(
            "Inventory load failed:",
            error
        );

        setConnectionStatus(
            false,
            "Database Error"
        );

        showToast(
            `Inventory load failed: ${error.message}`,
            "error"
        );

    } finally {

        isLoadingInventory =
            false;
    }

}


/* =========================================================
   LOAD LOGS
   ========================================================= */

async function loadLogs() {

    if (isLoadingLogs) {
        return;
    }

    isLoadingLogs = true;

    try {

        const rows =
            await supabaseRequest(
                "chemical_logs",
                {
                    method: "GET",
                    query:
                        "?select=id,timestamp,chemical,action,quantity,unit,area,shift,new_main_balance,new_area_balance,operator_name,received_by&order=timestamp.desc"
                }
            );

        logs =
            Array.isArray(rows)

    } catch (error) {

        console.error(

        );

        showToast(

        );

    } finally {

    }

}

/* =========================================================
   QUANTITY ADJUSTMENT
   ========================================================= */

function adjustQty(
    chemId,
    change
) {

    const chem =
        chemicals.find(
            c => c.id === chemId
        );

    if (!chem) {
        return;
    }

    const targetElement =
        document.getElementById(
            `display-qty-${chemId}`
        );

    const badgeElement =
        document.getElementById(
            `badge-${chemId}`
        );

    let newQty =
        (selectedQtys[chemId] || 0) +
        change;

    if (newQty < 0) {
        return;
    }

    if (
        newQty >
        Number(chem.balance)
    ) {

        showToast(
            `Cannot exceed available stock balance (${formatNumber(chem.balance)} ${chem.unit})`,
            "warning"
        );

        return;
    }

    selectedQtys[chemId] =
        newQty;

    if (targetElement) {

        targetElement.innerText =
            formatNumber(newQty);

        targetElement.classList.remove(
            "qty-bounce"
        );

        void targetElement.offsetWidth;

        targetElement.classList.add(
            "qty-bounce"
        );
    }

    if (badgeElement) {

        badgeElement.innerText =
            `+${formatNumber(newQty)}`;

        if (newQty > 0) {

            badgeElement.classList.remove(
                "scale-75",
                "opacity-0",
                "pointer-events-none"
            );

            badgeElement.classList.add(
                "scale-100",
                "opacity-100"
            );

        } else {

            badgeElement.classList.remove(
                "scale-100",
                "opacity-100"
            );

            badgeElement.classList.add(
                "scale-75",
                "opacity-0",
                "pointer-events-none"
            );

        }

    }

}

/* =========================================================
   EXECUTE USAGE TRANSACTION
   ========================================================= */

async function executeSupabaseTx() {

    const operatorName =
        document
            .getElementById("tx-operator")
            .value
            .trim()
            .toUpperCase();

    if (!operatorName) {

        showToast(
            "Operator name is required.",
            "warning"
        );

        return;
    }

    if (!currentArea) {

        showToast(
            "Please select a plant area first.",
            "warning"
        );

        return;
    }

    const chemId =
        activeTxChemId;

    const deductionQty =
        Number(
            selectedQtys[chemId] || 0
        );

    const chem =
        chemicals.find(
            c => c.id === chemId
        );

    if (!chem || !chem.dbId) {

        showToast(
            "Chemical inventory record not found.",
            "error"
        );

        return;
    }

    if (deductionQty <= 0) {

        showToast(
            "Invalid quantity.",
            "warning"
        );

        return;
    }

    const button =
        document.getElementById(
            "tx-confirm-btn"
        );

    button.disabled =
        true;

    button.innerText =
        "Saving...";

    try {

        /*
         * IMPORTANT:
         * Re-read current stock from Supabase
         * before deducting.
         */

        const freshRows =
            await supabaseRequest(
                "chemical_inventory",
                {
                    method: "GET",
                    query:
                        `?select=id,chemical,unit,quantity,updated_at&id=eq.${encodeURIComponent(chem.dbId)}`
                }
            );

        const fresh =
            freshRows?.[0];

        if (!fresh) {
            throw new Error(
                "Inventory record no longer exists."
            );
        }

        const currentBalance =
            Number(fresh.quantity || 0);

        if (
            deductionQty >
            currentBalance
        ) {

            throw new Error(
                `Insufficient stock. Current balance is ${formatNumber(currentBalance)} ${fresh.unit}.`
            );
        }

        const newBalance =
            currentBalance -
            deductionQty;


        /* UPDATE INVENTORY */

        await supabaseRequest(
            "chemical_inventory",
            {
                method: "PATCH",

                query:
                    `?id=eq.${encodeURIComponent(chem.dbId)}`,

                body: {
                    quantity:
                        newBalance,

                    updated_at:
                        new Date().toISOString()
                },

                prefer:
                    "return=representation"
            }
        );


        /* INSERT USAGE LOG */

        await supabaseRequest(
            "chemical_logs",
            {
                method: "POST",

                body: {

                    timestamp:
                        new Date().toISOString(),

                    chemical:
                        fresh.chemical,

                    action:
                        "OUT",

                    quantity:
                        deductionQty,

                    unit:
                        fresh.unit,

                    area:
                        currentArea,

                    shift:
                        getCurrentShift(),

                    new_main_balance:
                        newBalance,

                    new_area_balance:
                        newBalance,

                    operator_name:
                        operatorName,

                    received_by:
                        null
                },

                prefer:
                    "return=representation"
            }
        );


        /* REFRESH LOCAL STATE */

        chem.balance =
            newBalance;

        selectedQtys[chemId] =
            0;

        await loadLogs();

        renderChems();

        updateNotifBadge();

        closeTxModal();

        showToast(
            `${chem.name}: ${formatNumber(deductionQty)} ${chem.unit} deducted successfully.`
        );

    } catch (error) {

        console.error(
            "Usage transaction failed:",
            error
        );

        showToast(
            error.message ||
            "Transaction failed.",
            "error"
        );

    } finally {

        button.disabled =
            false;

        button.innerText =
            "Confirm";
    }

}


/* =========================================================
   ADMIN ADD STOCK / DELIVERY
   ========================================================= */

async function adminAddStock() {

    const id =
        document
            .getElementById("admin-chem-select")
            .value;

    const qtyInput =
        Number(
            document
                .getElementById("admin-qty")
                .value
        );

    const receiver =
        document
            .getElementById("admin-receiver")
            .value
            .trim()
            .toUpperCase();

    if (
        !qtyInput ||
        qtyInput <= 0
    ) {

        showToast(
            "Please enter a valid quantity.",
            "warning"
        );

        return;
    }

    if (!receiver) {

        showToast(
            "Received By is required.",
            "warning"
        );

        return;
    }

    const chem =
        chemicals.find(
            c => c.id === id
        );

    if (!chem || !chem.dbId) {

        showToast(
            "Chemical inventory record not found.",
            "error"
        );

        return;
    }

    const submitButton =
        document.querySelector(
            "#delivery-form button[onclick='adminAddStock()']"
        );

    if (submitButton) {

        submitButton.disabled =
            true;

        submitButton.innerText =
            "Saving...";
    }

    try {

        /*
         * Existing business rule:
         * Aluminium Sulphate is entered by sack.
         * 1 sack = 25 kg.
         */

        const actualQuantity =
            id === "alum"
                ? qtyInput * 25
                : qtyInput;


        /* REFRESH INVENTORY */

        const freshRows =
            await supabaseRequest(
                "chemical_inventory",
                {
                    method: "GET",
                    query:
                        `?select=id,chemical,unit,quantity,updated_at&id=eq.${encodeURIComponent(chem.dbId)}`
                }
            );

        const fresh =
            freshRows?.[0];

        if (!fresh) {
            throw new Error(
                "Inventory record no longer exists."
            );
        }

        const currentBalance =
            Number(fresh.quantity || 0);

        const newBalance =
            currentBalance +
            actualQuantity;


        /* UPDATE INVENTORY */

        await supabaseRequest(
            "chemical_inventory",
            {
                method: "PATCH",

                query:
                    `?id=eq.${encodeURIComponent(chem.dbId)}`,

                body: {

                    quantity:
                        newBalance,

                    updated_at:
                        new Date().toISOString()
                },

                prefer:
                    "return=representation"
            }
        );


        /* INSERT DELIVERY LOG */

        await supabaseRequest(
            "chemical_logs",
            {
                method: "POST",

                body: {

                    timestamp:
                        new Date().toISOString(),

                    chemical:
                        fresh.chemical,

                    action:
                        "IN",

                    quantity:
                        actualQuantity,

                    unit:
                        fresh.unit,

                    area:
                        null,

                    shift:
                        getCurrentShift(),

                    new_main_balance:
                        newBalance,

                    new_area_balance:
                        newBalance,

                    operator_name:
                        null,

                    received_by:
                        receiver
                },

                prefer:
                    "return=representation"
            }
        );


        chem.balance =
            newBalance;

        await loadLogs();

        renderChems();

        updateNotifBadge();

        document
            .getElementById("admin-qty")
            .value = "";

        document
            .getElementById("admin-receiver")
            .value = "";

        document
            .getElementById("delivery-form")
            .classList.add("hidden");

        if (activeTab === "IN") {
            applyFilters();
        }

        showToast(
            `Successfully added ${formatNumber(actualQuantity)} ${fresh.unit} to ${fresh.chemical}.`
        );

    } catch (error) {

        console.error(
            "Delivery failed:",
            error
        );

        showToast(
            error.message ||
            "Delivery transaction failed.",
            "error"
        );

    } finally {

        if (submitButton) {

            submitButton.disabled =
                false;

            submitButton.innerText =
                "Submit Delivery";
        }

    }

}

/* =========================================================
   GET FILTERED LOGS
   ========================================================= */

function getFilteredLogs() {

    let data =
        logs.filter(
            l => l.action === activeTab
        );

    const dateElement =
        document.getElementById("f-date");

    const selectedDate =
        dateElement
            ? dateElement.value
            : "";

    if (selectedDate) {

        data =
            data.filter(l => {

                if (!l.timestamp) {
                    return false;
                }

                return l.timestamp
                    .slice(0, 10) ===
                    selectedDate;
            });

    }


    if (activeTab === "OUT") {

        const chemElement =
            document.getElementById("f-chem");

        const areaElement =
            document.getElementById("f-area");

        const chem =
            chemElement
                ? chemElement.value
                : "ALL";

        const area =
            areaElement
                ? areaElement.value
                : "ALL";

        if (chem !== "ALL") {

            data =
                data.filter(
                    l =>
                        normalizeChemicalName(
                            l.chemical
                        ) ===
                        normalizeChemicalName(
                            chem
                        )
                );
        }

        if (area !== "ALL") {

            data =
                data.filter(
                    l =>
                        l.area === area
                );
        }

    } else {

        const receiverElement =
            document.getElementById("f-rcv");

        const receiver =
            receiverElement
                ? receiverElement.value
                    .trim()
                    .toUpperCase()
                : "";

        if (receiver) {

            data =
                data.filter(l =>
                    String(
                        l.received_by || ""
                    )
                        .toUpperCase()
                        .includes(receiver)
                );
        }

    }

    return data;
}

/* =========================================================
   CORRECT USAGE
   ========================================================= */

async function correctUsage(
    logId
) {

    const confirmed =
        confirm(
            "CORRECTION:\n\nThis will RETURN the used quantity to inventory and create a correction record.\n\nContinue?"
        );

    if (!confirmed) {
        return;
    }

    const log =
        logs.find(
            l => String(l.id) ===
            String(logId)
        );

    if (!log) {

        showToast(
            "Usage record not found.",
            "error"
        );

        return;
    }

    const chem =
        findChemicalByName(
            log.chemical
        );

    if (!chem || !chem.dbId) {

        showToast(
            "Chemical inventory record not found.",
            "error"
        );

        return;
    }

    try {

        const freshRows =
            await supabaseRequest(
                "chemical_inventory",
                {
                    method: "GET",
                    query:
                        `?select=id,chemical,unit,quantity&id=eq.${encodeURIComponent(chem.dbId)}`
                }
            );

        const fresh =
            freshRows?.[0];

        if (!fresh) {
            throw new Error(
                "Inventory record not found."
            );
        }

        const currentBalance =
            Number(fresh.quantity || 0);

        const restoreQty =
            Number(log.quantity || 0);

        const newBalance =
            currentBalance +
            restoreQty;


        /* RESTORE INVENTORY */

        await supabaseRequest(
            "chemical_inventory",
            {
                method: "PATCH",

                query:
                    `?id=eq.${encodeURIComponent(chem.dbId)}`,

                body: {

                    quantity:
                        newBalance,

                    updated_at:
                        new Date().toISOString()
                },

                prefer:
                    "return=representation"
            }
        );


        /* CREATE CORRECTION LOG */

        await supabaseRequest(
            "chemical_logs",
            {
                method: "POST",

                body: {

                    timestamp:
                        new Date().toISOString(),

                    chemical:
                        fresh.chemical,

                    action:
                        "CORRECTION-OUT",

                    quantity:
                        restoreQty,

                    unit:
                        fresh.unit,

                    area:
                        log.area || null,

                    shift:
                        getCurrentShift(),

                    new_main_balance:
                        newBalance,

                    new_area_balance:
                        newBalance,

                    operator_name:
                        `CORRECTION OF ${log.operator_name || "UNKNOWN"}`,

                    received_by:
                        null
                },

                prefer:
                    "return=representation"
            }
        );


        chem.balance =
            newBalance;

        await loadLogs();

        renderChems();

        applyFilters();

        updateNotifBadge();

        showToast(
            "Usage corrected and stock restored."
        );

    } catch (error) {

        console.error(
            error
        );

        showToast(
            error.message ||
            "Correction failed.",
            "error"
        );

    }

}


/* =========================================================
   CORRECT DELIVERY
   ========================================================= */

async function correctDelivery(
    logId
) {

    const confirmed =
        confirm(
            "CORRECTION:\n\nThis will REMOVE the delivered quantity from inventory and create a correction record.\n\nContinue?"
        );

    if (!confirmed) {
        return;
    }

    const log =
        logs.find(
            l => String(l.id) ===
            String(logId)
        );

    if (!log) {

        showToast(
            "Delivery record not found.",
            "error"
        );

        return;
    }

    const chem =
        findChemicalByName(
            log.chemical
        );

    if (!chem || !chem.dbId) {

        showToast(
            "Chemical inventory record not found.",
            "error"
        );

        return;
    }

    try {

        const freshRows =
            await supabaseRequest(
                "chemical_inventory",
                {
                    method: "GET",
                    query:
                        `?select=id,chemical,unit,quantity&id=eq.${encodeURIComponent(chem.dbId)}`
                }
            );

        const fresh =
            freshRows?.[0];

        if (!fresh) {
            throw new Error(
                "Inventory record not found."
            );
        }

        const currentBalance =
            Number(fresh.quantity || 0);

        const deliveryQty =
            Number(log.quantity || 0);

        if (
            deliveryQty >
            currentBalance
        ) {

            throw new Error(
                `Cannot correct delivery. Current balance (${formatNumber(currentBalance)}) is lower than delivery quantity (${formatNumber(deliveryQty)}).`
            );
        }

        const newBalance =
            currentBalance -
            deliveryQty;


        /* UPDATE INVENTORY */

        await supabaseRequest(
            "chemical_inventory",
            {
                method: "PATCH",

                query:
                    `?id=eq.${encodeURIComponent(chem.dbId)}`,

                body: {

                    quantity:
                        newBalance,

                    updated_at:
                        new Date().toISOString()
                },

                prefer:
                    "return=representation"
            }
        );


        /* CORRECTION LOG */

        await supabaseRequest(
            "chemical_logs",
            {
                method: "POST",

                body: {

                    timestamp:
                        new Date().toISOString(),

                    chemical:
                        fresh.chemical,

                    action:
                        "CORRECTION-IN",

                    quantity:
                        deliveryQty,

                    unit:
                        fresh.unit,

                    area:
                        null,

                    shift:
                        getCurrentShift(),

                    new_main_balance:
                        newBalance,

                    new_area_balance:
                        newBalance,

                    operator_name:
                        "DELIVERY CORRECTION",

                    received_by:
                        log.received_by || null
                },

                prefer:
                    "return=representation"
            }
        );


        chem.balance =
            newBalance;

        await loadLogs();

        renderChems();

        applyFilters();

        updateNotifBadge();

        showToast(
            "Delivery corrected and stock adjusted."
        );

    } catch (error) {

        console.error(
            error
        );

        showToast(
            error.message ||
            "Delivery correction failed.",
            "error"
        );

    }

}


/* =========================================================
   ANALYTICS
   ========================================================= */

function renderStats(
    period = "today"
) {

    const container =
        document.getElementById(
            "admin-content-area"
        );

    const now =
        new Date();

    let filtered =
        logs.filter(
            l =>
                l.action === "OUT"
        );


    if (period === "today") {

        filtered =
            filtered.filter(
                l =>
                    l.timestamp &&
                    l.timestamp.slice(0, 10) ===
                    getToday()
            );

    }


    if (period === "month") {

        const month =
            `${now.getFullYear()}-${String(
                now.getMonth() + 1
            ).padStart(2, "0")}`;

        filtered =
            filtered.filter(
                l =>
                    l.timestamp &&
                    l.timestamp.startsWith(month)
            );

    }


    if (period === "year") {

        const year =
            String(
                now.getFullYear()
            );

        filtered =
            filtered.filter(
                l =>
                    l.timestamp &&
                    l.timestamp.startsWith(year)
            );

    }


    const areas = [
        "BOILER",
        "WTP",
        "WWTP",
        "OTHERS"
    ];


    const totalUsage =
        filtered.reduce(
            (sum, l) =>
                sum +
                Number(l.quantity || 0),
            0
        );


    const chemicalTotals = {};

    filtered.forEach(l => {

        const name =
            l.chemical || "Unknown";

        chemicalTotals[name] =
            (chemicalTotals[name] || 0) +
            Number(l.quantity || 0);

    });


    const sortedChemicals =
        Object.entries(
            chemicalTotals
        )
            .sort(
                (a, b) =>
                    b[1] - a[1]
            );


    container.innerHTML = `

        <div
            class="bg-white p-6 rounded-[2.5rem] border border-emerald-100 shadow-sm mb-4">

            <div class="flex justify-between items-center mb-6">

                <div>

                    <h3
                        class="text-[10px] font-black uppercase text-emerald-800/40">
                        Analytics
                    </h3>

                    <p
                        class="text-[8px] text-slate-400 uppercase font-bold mt-1">
                        Chemical usage monitoring
                    </p>

                </div>


                <select
                    id="stat-p"
                    onchange="renderStats(this.value)"
                    class="text-[9px] font-black bg-emerald-50 p-2 rounded-xl border-none outline-none text-emerald-700">

                    <option value="today">
                        Today
                    </option>

                    <option value="month">
                        Month
                    </option>

                    <option value="year">
                        Year
                    </option>

                </select>

            </div>


            <div class="grid grid-cols-2 gap-3 mb-6">

                <div
                    class="bg-emerald-50 rounded-2xl p-4">

                    <span
                        class="block text-[7px] font-black uppercase text-emerald-400">
                        Total Usage
                    </span>

                    <strong
                        class="block text-xl font-black text-emerald-900 mt-1">
                        ${formatNumber(totalUsage)}
                    </strong>

                </div>


                <div
                    class="bg-slate-50 rounded-2xl p-4">

                    <span
                        class="block text-[7px] font-black uppercase text-slate-400">
                        Transactions
                    </span>

                    <strong
                        class="block text-xl font-black text-slate-800 mt-1">
                        ${filtered.length}
                    </strong>

                </div>

            </div>


            <div class="space-y-5">

                ${
                    areas.map(area => {

                        const areaLogs =
                            filtered.filter(
                                l =>
                                    l.area === area
                            );

                        const total =
                            areaLogs.reduce(
                                (sum, l) =>
                                    sum +
                                    Number(
                                        l.quantity || 0
                                    ),
                                0
                            );

                        const max =
                            Math.max(
                                totalUsage,
                                1
                            );

                        const percentage =
                            Math.min(
                                (total / max) * 100,
                                100
                            );

                        return `

                            <div>

                                <div
                                    class="flex justify-between text-[10px] font-black mb-1 uppercase">

                                    <span>
                                        ${escapeHtml(area)}
                                    </span>

                                    <span class="text-emerald-600">
                                        ${formatNumber(total)} Units
                                    </span>

                                </div>


                                <div
                                    class="bg-emerald-50 h-3 rounded-full overflow-hidden border border-emerald-100">

                                    <div
                                        class="bg-emerald-600 h-full rounded-full transition-all duration-1000"
                                        style="width:${percentage}%">
                                    </div>

                                </div>


                            </div>

                        `;

                    }).join("")
                }

            </div>

        </div>


        <div
            class="bg-white p-6 rounded-[2.5rem] border border-emerald-100 shadow-sm">

            <h3
                class="text-[10px] font-black uppercase text-emerald-800/40 mb-5">
                Chemical Consumption
            </h3>

            <div class="space-y-3">

                ${
                    sortedChemicals.length

                        ? sortedChemicals.map(
                            ([name, qty]) => `

                                <div
                                    class="flex justify-between items-center p-3 bg-emerald-50/60 rounded-2xl">

                                    <span
                                        class="text-[9px] font-black uppercase text-emerald-900">

                                        ${escapeHtml(name)}

                                    </span>

                                    <span
                                        class="text-[10px] font-black text-emerald-700">

                                        ${formatNumber(qty)}

                                    </span>

                                </div>

                            `
                        ).join("")

                        : `
                            <div
                                class="py-10 text-center text-emerald-100 text-[10px] font-black uppercase italic">
                                No Data
                            </div>
                        `
                }

            </div>

        </div>

    `;

    document
        .getElementById("stat-p")
        .value =
        period;

}

/* =========================================================
   SHIFT SUMMARY
   ========================================================= */

function showShiftSummary() {

    const shift =
        getCurrentShift();

    const today =
        getToday();

    const todayLogs =
        logs.filter(
            l =>
                l.timestamp &&
                l.timestamp.slice(0, 10) ===
                today
        );

    const usage =
        todayLogs.filter(
            l =>
                l.action === "OUT"
        );

    const delivery =
        todayLogs.filter(
            l =>
                l.action === "IN"
        );


    let report =
        `📌 SHIFT REPORT (${shift})\n`;

    report +=
        `Date: ${today}\n\n`;

    report +=
        `--- USAGE ---\n`;


    if (usage.length) {

        chemicals.forEach(
            chem => {

                const used =
                    usage
                        .filter(
                            l =>
                                normalizeChemicalName(
                                    l.chemical
                                ) ===
                                normalizeChemicalName(
                                    chem.name
                                )
                        )
                        .reduce(
                            (sum, l) =>
                                sum +
                                Number(
                                    l.quantity || 0
                                ),
                            0
                        );

                if (used > 0) {

                    report +=
                        `🔹 ${chem.name}: ${formatNumber(used)} ${chem.unit}\n`;
                }

            }
        );

    } else {

        report +=
            "(No usage)\n";

    }


    report +=
        `\n--- DELIVERIES ---\n`;


    if (delivery.length) {

        delivery.forEach(
            d => {

                report +=
                    `📦 ${d.chemical}: +${formatNumber(d.quantity)} ${d.unit || ""} (${d.received_by || "N/A"})\n`;

            }
        );

    } else {

        report +=
            "(No deliveries)\n";

    }


    document
        .getElementById(
            "summary-text"
        )
        .innerText =
        report;

    document
        .getElementById(
            "summary-modal"
        )
        .style.display =
        "flex";

    document
        .getElementById(
            "summary-badge"
        )
        .classList.add(
            "hidden"
        );

}

}


/* =========================================================
   EXCEL EXPORT
   ========================================================= */

function exportCurrentExcel() {

    if (
        typeof XLSX ===
        "undefined"
    ) {

        showToast(
            "Excel library is not loaded. Check internet connection.",
            "error"
        );

        return;
    }


    let data =
        activeTab === "STATS"
            ? logs.filter(
                l =>
                    l.action === "OUT"
            )
            : getFilteredLogs();


    const excelData =
        data.map(
            l => ({

                "Date / Time":
                    formatDateTime(
                        l.timestamp
                    ),

                "Chemical":
                    l.chemical || "",

                "Action":
                    l.action || "",

                "Quantity":
                    Number(
                        l.quantity || 0
                    ),

                "Unit":
                    l.unit || "",

                "Area":
                    l.area || "",

                "Shift":
                    l.shift || "",

                "Operator Name":
                    l.operator_name || "",

                "Received By":
                    l.received_by || "",

                "New Main Balance":
                    Number(
                        l.new_main_balance || 0
                    ),

                "New Area Balance":
                    Number(
                        l.new_area_balance || 0
                    )

            })
        );


    if (!excelData.length) {

        showToast(
            "No records available for Excel export.",
            "warning"
        );

        return;
    }


    const worksheet =
        XLSX.utils.json_to_sheet(
            excelData
        );

    const workbook =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Chemical Log"
    );


    const fileDate =
        getToday();

    const fileName =
        activeTab === "OUT"
            ? `Chemical_Usage_${fileDate}.xlsx`
            : activeTab === "IN"
                ? `Chemical_Deliveries_${fileDate}.xlsx`
                : `Chemical_Analytics_${fileDate}.xlsx`;


    XLSX.writeFile(
        workbook,
        fileName
    );


    showToast(
        "Excel report generated successfully."
    );

}


/* =========================================================
   AUTO REFRESH
   ========================================================= */

setInterval(
    async () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            await loadInventory();
            await loadLogs();

            if (
                !document
                    .getElementById(
                        "admin-dashboard"
                    )
                    .classList.contains(
                        "admin-hidden"
                    )
            ) {

                if (activeTab === "STATS") {
                    renderStats("today");
                } else {
                    applyFilters();
                }

            }

        }

    },
    30000
);


/* =========================================================
   CLOSE MODALS WITH ESCAPE
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            closeTxModal();
            closeSummary();

        }

    }
);


/* =========================================================
   START APPLICATION
   ========================================================= */

init();

</script>
